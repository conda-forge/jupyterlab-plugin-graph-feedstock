{% set name = "jupyterlab-plugin-graph" %}
{% set version = "0.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6c43f0782879a3f6c0591d5a46627a9173380447a306a30232141d62744d8d33

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - jupyter-packaging >=0.10,<1
  run:
    - jupyterlab ~=3.0
    - python >={{ python_min }}

test:
  commands:
    - pip check
    - test -f "${PREFIX}/share/jupyter/labextensions/jupyterlab-plugin-graph/package.json"                                    # [unix]
    - if exist %PREFIX%\\share\\jupyter\\labextensions\\jupyterlab-plugin-graph\\package.json (exit 0) else (exit 1)          # [win]
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jupyterlab-contrib/jupyterlab-plugin-graph
  summary: JupyterLab extension to show an interactive dependency graph of the installed plugins
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jtpio
    - fcollonval
